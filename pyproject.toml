[project]
name = "network-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "scipy>=1.14.0",
    "pandas>=2.2",
    "plotly>=6.6.0",
    "tqdm>=4.67.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "pywavelets>=1.9.0",
    "seaborn>=0.13.2",
    "wandb>=0.27.2",
    "tensorboard>=2.20.0",
    "python-dotenv>=1.2.2",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "torch-shampoo>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torch-shampoo = { git = "https://github.com/facebookresearch/optimizers.git" }


[project.scripts]
compute = "scripts.run_simulation:main"
pretrain-models = "scripts.pretrain_models:main"
analyse = "scripts.analyse_sim_results:main"
plot = "visualize_webapp.app:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "analysis*",
  "compute_results*",
  "experiments*",
  "models*",
  "optimizers*",
  "scripts*",
  "visualize_webapp*",
]

[tool.basedpyright]
extraPaths = ["."]
